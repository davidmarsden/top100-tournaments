name: Audit Supabase migration SQL (read-only)
on:
  workflow_dispatch:
    inputs:
      export_artifact_run_id:
        description: 'Run ID containing a private migration-export artifact (no database credentials)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davidmarsden/top100-manager-lab
          path: manager-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download private migration export artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.export_artifact_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/migration-export"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name supabase-migration-export --dir "$RUNNER_TEMP/migration-export"
          test -s "$RUNNER_TEMP/migration-export/remote-migrations.json"
      - name: Compare migration sources
        run: |
          node scripts/audit-supabase-migrations.mjs \
            --remote "$RUNNER_TEMP/migration-export/remote-migrations.json" \
            --lab manager-lab \
            --output "$RUNNER_TEMP/migration-audit.json"
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-comparison-report
          path: ${{ runner.temp }}/migration-audit.json
          if-no-files-found: warn
          retention-days: 7
