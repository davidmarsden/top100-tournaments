name: Audit Supabase migration inventory (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tournaments
        uses: actions/checkout@v4
      - name: Checkout Manager Lab
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/top100-manager-lab
          path: manager-lab
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical migration inventory
        run: |
          node scripts/audit-supabase-migrations.mjs \
            --recovered docs/recovered-supabase-migrations \
            --lab manager-lab \
            --output "$RUNNER_TEMP/migration-audit.json"
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-comparison-report
          path: ${{ runner.temp }}/migration-audit.json
          if-no-files-found: warn
          retention-days: 7
