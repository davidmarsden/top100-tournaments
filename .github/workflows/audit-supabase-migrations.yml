name: Audit Supabase migration SQL (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davidmarsden/top100-manager-lab
          path: manager-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export migration history using read-only SQL
        env:
          AUDIT_DATABASE_URL: ${{ secrets.SUPABASE_AUDIT_DATABASE_URL }}
        run: |
          if [ -z "$AUDIT_DATABASE_URL" ]; then
            echo "::error::Set SUPABASE_AUDIT_DATABASE_URL to a restricted read-only PostgreSQL connection URL."
            exit 1
          fi
          psql "$AUDIT_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c "select coalesce(json_agg(json_build_object('version',version,'name',name,'statements',statements) order by version),'[]'::json) from supabase_migrations.schema_migrations" \
            > "$RUNNER_TEMP/remote-migrations.json"
      - name: Inventory and compare migration sources
        run: |
          node scripts/audit-supabase-migrations.mjs \
            --remote "$RUNNER_TEMP/remote-migrations.json" \
            --lab manager-lab \
            --output "$RUNNER_TEMP/migration-audit.json"
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-comparison-report
          path: ${{ runner.temp }}/migration-audit.json
          if-no-files-found: warn
          retention-days: 7
