name: Migration permissions

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tools/migration-replay/**'
      - '.github/workflows/migration-permissions.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable, job-local database with no network exposure beyond the runner:
          # trust auth means no password exists to store or leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Install local pg_net stub into the service container
        run: |
          cid=$(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}' | head -1)
          extdir=$(docker exec "$cid" pg_config --sharedir)/extension
          docker cp tools/migration-replay/pg_net-stub/pg_net.control "$cid:$extdir/"
          docker cp tools/migration-replay/pg_net-stub/pg_net--0.20.3.sql "$cid:$extdir/"
      - name: Check grants on objects created by this PR's migrations
        run: tools/migration-replay/check-permissions.sh "origin/${{ github.base_ref }}"
      - name: Self-test the checker against known good and bad migrations
        run: tools/migration-replay/test-permissions-check.sh
