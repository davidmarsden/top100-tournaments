<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/top100-app-icon.svg" />
    <link id="app-manifest" rel="manifest" href="/tournaments.webmanifest" />
    <meta name="theme-color" content="#0B1F3B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Top 100" />
    <title>Top 100 Tournaments</title>
    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        const manifest = host.startsWith('manager.')
          ? '/my-matches.webmanifest'
          : host.startsWith('vote.')
            ? '/voting.webmanifest'
            : '/tournaments.webmanifest';
        document.getElementById('app-manifest')?.setAttribute('href', manifest);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
