<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/top100-app-icon.svg" />
    <link id="app-manifest" rel="manifest" href="/tournaments.webmanifest" />
    <meta name="theme-color" content="#0B1F3B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Top 100" />
    <title>Top 100 Tournaments</title>
    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        const manifest = host.startsWith('manager.')
          ? '/my-matches.webmanifest'
          : host.startsWith('vote.')
            ? '/voting.webmanifest'
            : '/tournaments.webmanifest';
        document.getElementById('app-manifest')?.setAttribute('href', manifest);
      })();
    </script>
    <script>
      (() => {
        const path = window.location.pathname;
        const isChatPath = /^\/chat\/?$/.test(path) || /^\/manager\/chat\/?$/.test(path);
        if (!isChatPath || !window.location.hash) return;

        const params = new URLSearchParams(window.location.hash.slice(1));
        const token = params.get('access_token');
        if (!token) return;

        // Claim the private chat ticket before the React application, Supabase
        // client, service worker or any other app code can touch the callback.
        window.__TOP100_CHAT_EARLY_CLAIM__ = true;
        document.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<main style="font-family:system-ui,sans-serif;padding:2rem"><h1>Opening Top 100 Chat…</h1><p>Your Top 100 membership is being checked.</p></main>';
          }
        });

        const CHAT_SHARE_STORAGE_KEY = 'top100PendingChatShare';
        const CHAT_SHARE_TTL_MS = 30 * 60 * 1000;

        function normalizeShare(value, requireFresh = false) {
          if (!value || typeof value !== 'object') return null;
          const title = String(value.title || '').trim().slice(0, 180);
          const rawUrl = String(value.url || '').trim().slice(0, 500);
          const createdAt = Number(value.createdAt || 0);
          if (!rawUrl) return null;
          if (requireFresh && (!createdAt || Date.now() - createdAt > CHAT_SHARE_TTL_MS)) return null;
          try {
            const parsed = new URL(rawUrl);
            if (parsed.protocol !== 'https:' || parsed.hostname !== 'smtop100.blog') return null;
            return { title, url: parsed.toString(), createdAt: createdAt || Date.now() };
          } catch {
            return null;
          }
        }

        const query = new URLSearchParams(window.location.search);
        let share = normalizeShare({
          title: query.get('shareTitle') || '',
          url: query.get('shareUrl') || '',
        });

        if (share) {
          share.createdAt = Date.now();
          try { localStorage.setItem(CHAT_SHARE_STORAGE_KEY, JSON.stringify(share)); } catch {}
        } else {
          try {
            share = normalizeShare(JSON.parse(localStorage.getItem(CHAT_SHARE_STORAGE_KEY) || 'null'), true);
            if (!share) localStorage.removeItem(CHAT_SHARE_STORAGE_KEY);
          } catch {
            try { localStorage.removeItem(CHAT_SHARE_STORAGE_KEY); } catch {}
          }
        }

        fetch('/.netlify/functions/chat-ticket', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(share ? { share } : {}),
        }).then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok || !body.url) {
            throw new Error((body && body.error) || ('Chat ticket failed with HTTP ' + response.status));
          }
          try { localStorage.removeItem(CHAT_SHARE_STORAGE_KEY); } catch {}
          history.replaceState(null, document.title, window.location.pathname + window.location.search);
          window.location.replace(body.url);
        }).catch((error) => {
          const show = () => {
            const root = document.getElementById('root');
            if (root) {
              root.innerHTML = '<main style="font-family:system-ui,sans-serif;padding:2rem"><h1>Top 100 Chat could not open</h1><p id="chat-early-error"></p><p><a href="/chat">Try again</a></p></main>';
              const node = document.getElementById('chat-early-error');
              if (node) node.textContent = error && error.message ? error.message : 'Unknown error';
            }
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, { once: true });
          else show();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
